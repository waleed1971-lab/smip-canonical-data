name: Repository integrity attestation
on:
  workflow_dispatch:
    inputs:
      snapshot_commit:
        description: Exact data commit to verify and attest; defaults to current main HEAD
        required: false
        type: string
concurrency:
  group: repository-integrity-attestation
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  verify-attest-publish:
    name: Verify, attest, and publish PASS receipt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Bind attestation to the exact main commit
        id: target
        env:
          REQUESTED_COMMIT: ${{ inputs.snapshot_commit }}
        run: |
          target="${REQUESTED_COMMIT:-${GITHUB_SHA}}"
          test "$target" = "$GITHUB_SHA"
          test "${#target}" -eq 40
          echo "commit=$target" >> "$GITHUB_OUTPUT"
      - name: Check out the exact snapshot commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.commit }}
          fetch-depth: 1
      - name: Run verifier tests
        run: python3 -m unittest scripts/test_verify_repository_integrity.py
      - name: Verify all parts and reconstruct canonical
        env:
          GITHUB_SHA: ${{ steps.target.outputs.commit }}
        run: |
          python3 scripts/verify_repository_integrity.py \
            --root . \
            --output repository-integrity-receipt.json
      - name: Generate signed repository-side attestation
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: repository-integrity-receipt.json
      - name: Record verification summary
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            echo "## SMIP repository-side integrity attestation"
            echo
            echo "- Status: PASS"
            echo "- Verified snapshot commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Attestation: ${ATTESTATION_URL}"
            echo "- Consumer-side byte verification: NOT_PERFORMED"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish PASS receipt to the default branch
        env:
          SOURCE_COMMIT_SHA: ${{ steps.target.outputs.commit }}
        run: |
          test -s repository-integrity-receipt.json
          grep -Fq '"verification_type": "repository-side integrity attestation"' repository-integrity-receipt.json
          grep -Fq '"status": "PASS"' repository-integrity-receipt.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository-integrity-receipt.json
          git commit -m "Publish integrity receipt for ${SOURCE_COMMIT_SHA}"
          git push origin HEAD:main
